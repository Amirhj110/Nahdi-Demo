<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nahdi Skin — Layla AI Advisor · IDRAK Voice & Chat Agent Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2c6ba4;--blue2:#3a80bf;--navy:#1f4f7d;--navy2:#14385c;--sky:#eaf2f9;--sky2:#d6e6f4;--ink:#424242;--muted:#7a7a7a;--line:#e7ecf0;--bg:#f4f8fa;
--red:#ea264d;--orange:#f39c22;--yellow:#f6c343;--green:#41c18a;--purple:#7b4fc2;--pink:#e85d9a;--r:16px;--sh:0 10px 30px rgba(18,58,99,.08);--chatw:420px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat','Almarai',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select{font-family:'Almarai','Montserrat',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select{font:inherit}
.rainbow{height:4px;background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue2),var(--purple))}
.concept{background:var(--navy2);color:#b9cde3;font-size:12.5px;text-align:center;padding:7px 14px}
.concept b{color:#fff}
.concept .pill{display:inline-block;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:1px 9px;margin:0 3px;font-weight:700}
/* header */
header{position:sticky;top:0;z-index:40}
.top{background:var(--blue)}
.hwrap{max-width:1320px;margin:auto;display:flex;align-items:center;gap:18px;padding:14px 26px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;cursor:pointer;line-height:1}
.logo .ar{font-family:'Almarai';font-weight:700;font-size:22px}
.logo .en{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo .gem{width:34px;height:34px;border-radius:9px;background:conic-gradient(var(--red),var(--orange),var(--yellow),var(--green),var(--blue2),var(--purple),var(--red));display:grid;place-items:center}
.logo .gem i{width:18px;height:18px;border-radius:5px;background:var(--blue);display:block}
.pickup{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.pickup span.ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:10px;padding:11px 14px;color:#e6f0fb;font-size:14px;cursor:pointer;transition:.2s;min-width:0}
.search:hover{background:rgba(255,255,255,.28)}
.search span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .ai{margin-inline-start:auto;background:#fff;color:var(--blue);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.hlink{color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.login{border:1.5px solid #fff;color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.icb{color:#fff;position:relative;width:36px;height:36px;display:grid;place-items:center}
.badge{position:absolute;top:-2px;inset-inline-end:-4px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.badge.bump{animation:bump .6s}@keyframes bump{40%{transform:scale(1.6)}}
.sub{background:#fff;border-bottom:1px solid var(--line)}
.subw{max-width:1320px;margin:auto;display:flex;align-items:center;gap:6px;padding:0 26px;overflow-x:auto}
.subw button{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink);padding:13px 12px;white-space:nowrap;border-bottom:2.5px solid transparent}
.subw button.allc{color:var(--blue);border-inline-end:1px solid var(--line);padding-inline-end:20px;margin-inline-end:8px}
.subw button.on{border-bottom-color:var(--blue);color:var(--blue)}
.subw button.ai{color:#fff;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:999px;padding:7px 14px;margin-inline-start:auto}
/* layout */
main,header,.concept,.rainbow{transition:margin .45s cubic-bezier(.2,.8,.2,1)}
body.chat-open main,body.chat-open header,body.chat-open .concept,body.chat-open .rainbow{margin-inline-end:var(--chatw)}
.page{display:none;max-width:1320px;margin:auto;padding:22px 26px 70px;animation:pin .5s ease}
.page.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ribbon{display:none;align-items:center;gap:10px;background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;margin-bottom:16px;box-shadow:0 8px 20px rgba(45,106,169,.25)}
.ribbon.show{display:flex;animation:pin .5s}
.ribbon img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #fff}
h1,h2,h3{letter-spacing:-.4px}[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{letter-spacing:0}
.sec-t{display:flex;align-items:end;justify-content:space-between;margin:40px 0 16px;gap:16px}
.sec-t h2{font-size:24px}
.sec-t p{color:var(--muted);font-size:14px;margin-top:4px}
.link{color:var(--blue);font-weight:700;font-size:14px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:10px;font-weight:700;font-size:14.5px;transition:.2s;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--navy)}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.callg{background:var(--green);color:#fff}.btn.callg:hover{filter:brightness(1.07)}
.btn.wh{background:#fff;color:var(--navy)}
.btn.gl{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
/* layla */
.lphoto{object-fit:cover;object-position:50% 25%;background:linear-gradient(135deg,var(--sky2),#fff)}
.online{position:relative}
.online:after{content:"";position:absolute;bottom:4%;inset-inline-end:4%;width:24%;height:24%;max-width:14px;max-height:14px;border-radius:50%;background:#22c55e;border:2px solid #fff}
/* hero */
.hero{display:grid;grid-template-columns:2.1fr 1fr;gap:18px}
.slides{position:relative;border-radius:22px;overflow:hidden;min-height:380px;background:var(--sky)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:40px 50px;opacity:0;transition:opacity .8s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide h1{font-size:44px;line-height:1.05;color:var(--navy)}
[dir=rtl] .slide h1{line-height:1.35;font-size:40px}
.slide .kick{display:inline-block;background:#fff;color:var(--blue);font-weight:800;font-size:12px;border-radius:999px;padding:5px 12px;margin-bottom:14px}
.slide p{color:#3d5269;font-size:16px;line-height:1.55;margin:14px 0 22px;max-width:420px}
.slide .big{font-size:72px;font-weight:900;color:var(--navy);line-height:1}
.slide .art{position:relative;height:300px}
.slide .art .pp{position:absolute;filter:drop-shadow(0 18px 22px rgba(18,58,99,.2));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.dots{position:absolute;bottom:16px;left:50px;display:flex;gap:6px;z-index:2}
[dir=rtl] .dots{left:auto;right:50px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(18,58,99,.25);cursor:pointer;transition:.3s}
.dots i.on{width:26px;background:var(--blue)}
.lcard{border-radius:22px;background:linear-gradient(165deg,var(--navy),var(--blue));color:#fff;padding:22px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lcard:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);top:-80px;inset-inline-end:-80px}
.lcard .tag{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#bcd6f2;text-transform:uppercase}
.lcard .ph{width:120px;height:120px;border-radius:50%;margin:16px 0 12px;border:4px solid rgba(255,255,255,.25);position:relative}
.lcard .ph img{width:100%;height:100%;border-radius:50%}
.lcard .ph:after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(255,255,255,.25);animation:ring2 2.4s infinite}
@keyframes ring2{to{transform:scale(1.25);opacity:0}}
.lcard h3{font-size:22px}
.lcard p{color:#cfe1f4;font-size:14px;line-height:1.5;margin:8px 0 16px}
.lcard .row{display:flex;gap:8px;margin-top:auto}
.lcard .row .btn{flex:1;justify-content:center;padding:12px}
.lcard .langs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.lcard .langs span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
/* circles */
.circles{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:26px}
.circ{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-align:center}
.circ .c{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;transition:.25s;border:2px solid transparent}
.circ:hover .c{transform:translateY(-3px);border-color:var(--blue)}
/* deals */
.deal{background:#fff;border-radius:22px;padding:22px;border:1px solid var(--line);margin-top:34px}
.deal .dh{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.deal .dh h2{font-size:22px;display:flex;gap:8px;align-items:center}
.cd{display:flex;gap:6px}
.cd span{background:var(--red);color:#fff;border-radius:8px;padding:6px 9px;font-weight:800;font-size:14px;min-width:38px;text-align:center}
/* products */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.25s;cursor:pointer;position:relative;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.pcard .pimg{height:190px;display:grid;place-items:center;position:relative;background:#fafcfe}
.pcard .off{position:absolute;top:10px;inset-inline-start:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}
.pcard .fav{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--muted);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.pcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard .br{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.pcard .nm{font-weight:600;font-size:14px;line-height:1.35;min-height:38px}
.stars{color:var(--orange);font-size:12px;font-weight:700}.stars span{color:var(--muted);font-weight:500}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:16px;color:var(--navy)}
.price small{font-size:11px;font-weight:600;color:var(--muted)}
.price s{font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.add{height:34px;padding:0 12px;border-radius:8px;background:var(--blue);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;transition:.2s}
.add:hover{background:var(--navy)}
.pcard.ai-pick{border:2px solid var(--blue);box-shadow:0 0 0 5px rgba(59,130,196,.14)}
.pcard.ai-pick .pick{position:absolute;bottom:10px;inset-inline-start:10px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px 4px 4px;border-radius:999px;display:flex;align-items:center;gap:5px}
[dir=rtl] .pcard.ai-pick .pick{padding:4px 4px 4px 8px}
.pcard.ai-pick .pick img{width:18px;height:18px;border-radius:50%}
.pcard.glow{animation:glow 1.6s ease 2}@keyframes glow{50%{box-shadow:0 0 0 10px rgba(59,130,196,.22)}}
/* layla band */
.band{margin-top:44px;border-radius:28px;background:radial-gradient(circle at 85% 20%,#2b5f9b,var(--navy) 55%,var(--navy2));color:#fff;padding:44px;display:grid;grid-template-columns:1.1fr 1fr;gap:34px;position:relative;overflow:hidden}
.band .eb{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.band h2{font-size:38px;line-height:1.1;margin:16px 0 12px}
[dir=rtl] .band h2{line-height:1.4}
.band p.l{color:#c7d9ee;font-size:16px;line-height:1.6;max-width:520px}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.cap{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;display:flex;gap:12px}
.cap i{font-style:normal;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px}
.cap b{display:block;font-size:14.5px;margin-bottom:3px}
.cap span{font-size:12.5px;color:#b9cde3;line-height:1.45}
.phone{justify-self:center;width:300px;border-radius:38px;background:#0a1f38;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
.phone .scr{border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#16477a,#0d2c4f);height:560px;display:flex;flex-direction:column;align-items:center;padding:30px 18px;text-align:center}
.phone .scr small{color:#a9c4e3;font-size:12px}
.phone .av{width:150px;height:150px;border-radius:50%;margin:26px 0 16px;position:relative}
.phone .av img{width:100%;height:100%;border-radius:50%;border:4px solid rgba(255,255,255,.2)}
.phone .av:before,.phone .av:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(110,180,255,.45);animation:ring2 2s infinite}
.phone .av:after{animation-delay:1s}
.phone .cap2{background:rgba(255,255,255,.1);border-radius:16px;padding:12px;font-size:13px;line-height:1.5;margin-top:18px;min-height:84px}
.phone .eq{display:flex;gap:3px;height:26px;align-items:center;margin-top:14px}
.phone .eq i{width:4px;border-radius:2px;background:#7fc0ff;animation:wv 1s ease-in-out infinite}
.phone .btns{display:flex;gap:18px;margin-top:auto}
.phone .btns span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.phone .btns span.end{background:var(--red)}
/* concerns */
.concerns{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:start;transition:.25s}
.ccard:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--sky2)}
.ccard .dot{width:44px;height:44px;border-radius:12px;margin-bottom:12px;display:grid;place-items:center}
.ccard b{display:block;font-size:14.5px}.ccard span{font-size:12.5px;color:var(--muted)}
/* ingredients */
.ings-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ing{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;cursor:pointer;transition:.2s}
.ing:hover{border-color:var(--blue);box-shadow:var(--sh)}
.ing .mol{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.ing b{font-size:15.5px}.ing p{font-size:13px;color:var(--muted);line-height:1.5;margin:4px 0 8px}
.ing .bf{font-size:12px;font-weight:700;color:var(--blue)}
/* brands */
.brands{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.brand{background:#fff;border:1px solid var(--line);border-radius:14px;height:86px;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:.5px;transition:.2s;cursor:pointer}
.brand:hover{border-color:var(--blue);color:var(--blue)}
.serv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.serv div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.serv b{display:block;color:var(--ink);font-size:14.5px}
.serv i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:12px;background:var(--sky);display:grid;place-items:center;flex:none}
/* category */
.cat-head{border-radius:22px;padding:30px 34px;display:flex;justify-content:space-between;align-items:center;gap:24px;border:1px solid var(--line)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.cat-head h1{font-size:34px;color:var(--navy)}
.cat-head p{color:#3d5269;margin-top:8px;max-width:560px;line-height:1.55}
.aitip{background:#fff;border-radius:16px;padding:14px 16px;max-width:360px;font-size:13.5px;line-height:1.5;display:flex;gap:12px;border:1px solid var(--line);box-shadow:var(--sh)}
.aitip img{width:42px;height:42px;border-radius:50%;flex:none}
.aitip b{color:var(--blue);display:block;font-size:12px;margin-bottom:3px}
.catl{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-top:20px}
.side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start;position:sticky;top:130px}
.side h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 10px}
.side h4:first-child{margin-top:0}
.side label{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:5px 0;cursor:pointer}
.side input{accent-color:var(--blue);width:16px;height:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
/* product */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.pd-img{background:linear-gradient(160deg,#fff,var(--sky));border-radius:24px;display:grid;place-items:center;min-height:520px;border:1px solid var(--line);position:relative}
.pd-img .thumbs{position:absolute;bottom:16px;display:flex;gap:10px}
.pd-img .thumbs i{width:54px;height:54px;border-radius:12px;background:#fff;border:1px solid var(--line);display:block}
.pd-img .thumbs i.on{border:2px solid var(--blue)}
.pd h1{font-size:30px;margin:6px 0 10px;color:var(--navy);line-height:1.2}
.pd .price{font-size:28px;margin:14px 0}
.fit{background:linear-gradient(135deg,var(--sky),#fff);border:1.5px solid var(--sky2);border-radius:18px;padding:16px;display:flex;gap:14px;margin:16px 0}
.fit img{width:46px;height:46px;border-radius:50%;flex:none}
.fit b{display:block;color:var(--blue);font-size:13px;margin-bottom:4px}
.fit p{font-size:14px;line-height:1.55}
.ingl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.ingl span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600}
.qty{display:flex;gap:10px}.qty .btn{flex:1;justify-content:center}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.meta div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12.5px;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-size:14px}
.tabs{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;font-size:14px;line-height:1.65;color:#3d5269}
.tabs b{color:var(--ink)}
.bundle{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bundle .plus{font-size:24px;color:var(--muted);font-weight:300}
.bundle .bi{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:8px 12px 8px 8px;font-size:13px;font-weight:600}
/* routine */
.rt-head{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:24px;padding:32px 36px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.rt-head .who{display:flex;gap:16px;align-items:center}
.rt-head img{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.3)}
.rt-head h1{font-size:32px}.rt-head p{color:#c7d9ee;margin-top:6px}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.rtcol{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.rtcol h3{display:flex;align-items:center;gap:10px;font-size:19px;margin-bottom:14px}
.rtcol h3 i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.rstep{display:flex;align-items:center;gap:14px;padding:11px;border-radius:14px;transition:.2s;cursor:pointer;opacity:0;animation:fin .5s forwards}
.rstep:hover{background:var(--sky)}
.rstep .no{width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--blue);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.rstep .im{width:62px;height:62px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.rstep small{display:block;color:var(--blue);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.rstep b{font-size:14px}.rstep em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.rstep .pr{margin-inline-start:auto;font-weight:800;white-space:nowrap;color:var(--navy)}
.rnotes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.rnotes div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13.5px;line-height:1.5;color:#3d5269}
.rnotes b{display:block;color:var(--ink);margin-bottom:4px}
/* analysis */
.an{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}
.scan{background:linear-gradient(160deg,var(--navy),#1b4f86);border-radius:24px;min-height:500px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.scan .line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#7fc0ff,transparent);box-shadow:0 0 24px #7fc0ff;animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%{top:12%}50%{top:85%}100%{top:12%}}
.scan .pt{position:absolute;width:12px;height:12px;border-radius:50%;background:#7fc0ff;box-shadow:0 0 0 6px rgba(127,192,255,.25);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(127,192,255,.05)}}
.scan .lbl{position:absolute;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 10px;font-size:12px}
.prof{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}
.prof h1{font-size:28px;color:var(--navy)}
.ptype{display:inline-flex;gap:8px;align-items:center;background:var(--sky);color:var(--blue);font-weight:800;border-radius:999px;padding:8px 14px;margin:12px 0 18px}
.meter{margin:13px 0}
.meter .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:7px}
.meter .bar{height:10px;border-radius:5px;background:var(--sky);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:5px;width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.insights div{background:var(--bg);border-radius:14px;padding:13px;font-size:13.5px;line-height:1.5}
.insights b{display:block;margin-bottom:3px}
/* cart */
.cart{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}
.cbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.citem{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.citem:last-child{border:0}
.citem .im{width:74px;height:74px;border-radius:14px;background:var(--sky);display:grid;place-items:center;flex:none}
.citem .q{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin-inline-start:auto}
.citem .q button{width:24px;height:24px;border-radius:50%;background:var(--sky);font-weight:700}
.sum{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px}
.sum.t{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:12px;align-items:center;font-size:14px}
.opt.on{border-color:var(--blue);background:var(--sky)}
.opt small{display:block;color:var(--muted)}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
/* ===== CHAT ===== */
.fabs{position:fixed;bottom:24px;inset-inline-end:24px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;transition:.3s}
body.chat-open .fabs{opacity:0;pointer-events:none;transform:scale(.85)}
.fab{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);padding:8px 18px 8px 8px;border-radius:999px;box-shadow:0 16px 40px rgba(18,58,99,.25);font-weight:700;border:1px solid var(--line)}
[dir=rtl] .fab{padding:8px 8px 8px 18px}
.fab img{width:48px;height:48px;border-radius:50%}
.fab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.fab .ph{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin-inline-start:6px}
.chat{position:fixed;top:0;bottom:0;inset-inline-end:0;width:var(--chatw);z-index:70;background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 50px rgba(18,58,99,.1)}
[dir=rtl] .chat{transform:translateX(-105%)}
body.chat-open .chat{transform:none}
.ch-head{padding:14px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
.ch-head .ph{width:48px;height:48px;flex:none}
.ch-head .ph img{width:100%;height:100%;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.ch-head b{display:block;font-size:15.5px}
.ch-head small{color:#cfe1f4;font-weight:500;font-size:12px}
.ch-head .x{margin-inline-start:auto;display:flex;gap:4px}
.ch-head .x button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ch-head .x button:hover{background:rgba(255,255,255,.15)}
.ch-head .x button.callb{background:var(--green)}
.ch-head .x button.off{opacity:.45}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.m{max-width:88%;font-size:14.2px;line-height:1.55;animation:pin .35s}
.m.u{align-self:flex-end;background:var(--blue);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px}
[dir=rtl] .m.u{border-radius:16px 16px 16px 4px}
.m.u .vo{display:flex;align-items:center;gap:6px;font-size:11px;color:#cfe1f4;margin-bottom:3px}
.m.b{align-self:flex-start;display:flex;gap:9px;max-width:96%}
.m.b>img{width:32px;height:32px;border-radius:50%;flex:none;margin-top:2px}
.m.b .bx{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:4px 16px 16px 16px;min-width:0}
[dir=rtl] .m.b .bx{border-radius:16px 4px 16px 16px}
.m.sys{align-self:center;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.caret{display:inline-block;width:7px;height:15px;background:var(--blue);margin-inline-start:2px;vertical-align:-2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.4;animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{30%{opacity:1;transform:translateY(-4px)}}
.mcards{display:flex;gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.mc{flex:none;width:146px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:.2s;animation:pin .4s backwards}
.mc:hover{border-color:var(--blue)}
.mc .im{height:94px;display:grid;place-items:center;background:#fff;border-radius:9px}
.mc b{display:block;font-size:12.5px;line-height:1.3;margin-top:7px;font-weight:600}
.mc span{font-size:12px;font-weight:800;color:var(--blue)}
.act{margin-top:10px;background:var(--sky);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.act .pb{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:var(--blue);width:0}
.act.run .pb{animation:pb 1.1s linear forwards}@keyframes pb{to{width:100%}}
.act.done{background:#e8f7ee;color:#15803d}
.sugg{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px 0}
.sugg button{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:#fff;font-weight:600;color:#2b4562}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
.composer{padding:12px 14px 14px;border-top:1px solid var(--line);background:#fff}
.inrow{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px}
[dir=rtl] .inrow{padding:5px 16px 5px 5px}
.inrow:focus-within{border-color:var(--blue)}
.inrow input{flex:1;border:0;background:none;outline:0;font-size:14.5px;min-width:0}
.mic{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.mic.on{background:var(--red)}
.mic.on:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--red);animation:ring 1.2s infinite}
@keyframes ring{to{transform:scale(1.4);opacity:0}}
.send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.listen{display:none;align-items:center;gap:12px;padding:0 4px 10px;font-size:13px;color:var(--red);font-weight:700}
.listen.on{display:flex}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;border-radius:2px;background:var(--red);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:22px}}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
/* ===== CALL ===== */
.call{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#1d5a96,var(--navy) 50%,#081d36);color:#fff;display:none;flex-direction:column;align-items:center;padding:34px 20px 30px;text-align:center}
.call.on{display:flex;animation:pin .4s}
.call .ctop{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:#b9d3ef;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 14px}
.call .ctop i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1.4s infinite}
.call .face{width:230px;height:230px;border-radius:50%;margin:46px 0 22px;position:relative;flex:none}
.call .face img{width:100%;height:100%;border-radius:50%;border:5px solid rgba(255,255,255,.18);position:relative;z-index:2;transition:transform .25s}
.call .face .r{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(127,192,255,.5);opacity:0}
.call.speaking .face .r{animation:ring3 1.8s infinite}
.call.speaking .face .r:nth-child(2){animation-delay:.6s}.call.speaking .face .r:nth-child(3){animation-delay:1.2s}
@keyframes ring3{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.call.speaking .face img{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.025)}}
.call.listening .face img{box-shadow:0 0 0 6px rgba(34,197,94,.45)}
.call h2{font-size:30px}
.call .st{color:#b9d3ef;font-size:14px;margin-top:6px;display:flex;gap:10px;align-items:center;justify-content:center}
.call .eq{display:flex;gap:4px;height:34px;align-items:center;margin:20px 0 6px;opacity:.25;transition:.3s}
.call.speaking .eq,.call.listening .eq{opacity:1}
.call .eq i{width:5px;height:6px;border-radius:3px;background:#7fc0ff}
.call.speaking .eq i{animation:wv2 .7s ease-in-out infinite}
.call.listening .eq i{background:#4ade80;animation:wv2 1.1s ease-in-out infinite}
@keyframes wv2{0%,100%{height:6px}50%{height:32px}}
.caption{max-width:620px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px 20px;font-size:17px;line-height:1.6;min-height:96px;margin-top:10px}
.caption small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#7fc0ff;margin-bottom:5px}
.caption.user small{color:#4ade80}
.ccards{display:flex;gap:10px;justify-content:center;margin-top:14px;min-height:10px}
.ccards div{background:#fff;border-radius:14px;padding:8px;width:120px;color:var(--ink);font-size:11.5px;font-weight:600;animation:pin .4s backwards;cursor:pointer}
.ccards div .im{height:76px;display:grid;place-items:center}
.cbtns{display:flex;gap:22px;margin-top:auto;padding-top:20px}
.cbtns button{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;transition:.2s}
.cbtns button:hover{background:rgba(255,255,255,.2)}
.cbtns button.end{background:var(--red)}
.cbtns button.off{background:#fff;color:var(--navy)}
.cbtns label{display:block;font-size:11.5px;color:#b9d3ef;margin-top:7px}
.hint{font-size:12px;color:#8fb0d3;margin-top:12px}
/* mini call */
.call.mini{inset:auto;bottom:24px;inset-inline-start:24px;width:340px;height:auto;border-radius:22px;padding:14px;flex-direction:row;flex-wrap:wrap;gap:12px;text-align:start;box-shadow:0 20px 50px rgba(0,0,0,.35);align-items:center}
.call.mini .ctop,.call.mini h2,.call.mini .eq,.call.mini .hint,.call.mini .ccards,.call.mini .cbtns label{display:none}
.call.mini .face{width:58px;height:58px;margin:0}
.call.mini .face img{border-width:3px}
.call.mini .st{font-size:12px;margin:0;justify-content:flex-start}
.call.mini .minfo{flex:1;min-width:0}
.call.mini .minfo b{display:block;font-size:15px}
.call.mini .caption{font-size:13px;min-height:0;padding:10px 12px;margin:0;border-radius:14px;order:5;max-height:92px;overflow:hidden}
.call.mini .caption small{font-size:10px;margin-bottom:2px}
.call.mini .cbtns{margin:0;padding:0;gap:8px}
.call.mini .cbtns button{width:40px;height:40px}
.call.mini .cbtns .hid{display:none}
.call .minfo b{display:none}
.call.mini .minfo b{display:block}
.call .expand{display:none}
.call.mini .expand{display:grid}
/* demo buttons */
.demos{position:fixed;bottom:24px;inset-inline-start:24px;z-index:60;display:flex;gap:8px}
.demos button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;display:flex;gap:7px;align-items:center;box-shadow:var(--sh)}
.demos button:hover{border-color:var(--blue);color:var(--blue)}
.demos button.running{background:var(--red);color:#fff;border-color:var(--red)}
body.in-call .demos,body.in-call .fabs{display:none}
.toast{position:fixed;top:130px;left:50%;transform:translate(-50%,-20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:120;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{background:var(--navy2);color:#9db6d1;padding:36px 26px 26px;font-size:13px}
footer .fw{max-width:1320px;margin:auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
footer b{color:#fff;display:block;margin-bottom:10px}
footer p{line-height:1.9}
footer .cp{max-width:1320px;margin:22px auto 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);text-align:center}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}.circles{grid-template-columns:repeat(6,1fr)}body.chat-open main,body.chat-open header,body.chat-open .concept,body.chat-open .rainbow{margin-inline-end:0}}
@media(max-width:900px){.hero,.pd,.rt,.an,.cart,.band,.catl{grid-template-columns:1fr}.grid,.grid.g4,.grid.g3{grid-template-columns:repeat(2,1fr)}.concerns,.brands{grid-template-columns:repeat(3,1fr)}.ings-g,.serv{grid-template-columns:1fr}.pickup,.hlink,.login{display:none}:root{--chatw:100vw}.slide{grid-template-columns:1fr}.slide .art{display:none}.side{display:none}}

/* ===== NAHDI SKIN ===== */
.search svg{flex:none}
.hwrap{padding:14px 32px;max-width:none}
.subw{max-width:none;padding:0 32px}
.page{max-width:none;padding:0 32px 60px}
.page>.ribbon{margin-top:16px}
.search{background:rgba(255,255,255,.28);border-radius:8px;max-width:420px;padding:12px 16px;color:#eaf1f8}
.flag{display:flex;align-items:center;gap:6px;color:#fff}
.flag span{width:24px;height:24px;border-radius:50%;background:#1b8b4c;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff}
.login{border-radius:6px;font-weight:600}
.subw button{font-weight:500;font-size:14px;padding:14px 12px}
.subw button.allc{font-weight:600}
.subw .ic{display:inline-grid;place-items:center}
.hero2{position:relative;margin:0 -32px;height:330px;overflow:hidden;border-radius:0!important;min-height:0!important}
.hero2 .slide{padding:0 18%;grid-template-columns:1fr 1.1fr}
.hero2 .slide h1{font-size:30px;font-weight:700;color:#111;line-height:1.25}
.hero2 .slide .big{font-size:96px;font-weight:800;color:#111;line-height:.95;letter-spacing:-3px}
.hero2 .slide .big small{font-size:38px;letter-spacing:0}
.hero2 .slide .sub2{font-size:20px;color:#222;font-weight:500;margin-top:6px}
.hero2 .slide .btn{border-radius:4px;padding:11px 44px;font-size:13px;margin-top:18px}
.hero2 .dots{left:3%;bottom:18px}
[dir=rtl] .hero2 .dots{right:3%;left:auto}
.hero2 .dots i{background:#c9cfd6;height:7px;width:7px}.hero2 .dots i.on{width:24px;background:#5b6b7b}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #d5dde5;display:grid;place-items:center;color:var(--blue);z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.arrow.l{inset-inline-start:12px}.arrow.r{inset-inline-end:12px}
[dir=rtl] .arrow svg{transform:scaleX(-1)}
.circles{display:flex;gap:22px;overflow-x:auto;margin:26px 0 0;padding-bottom:6px;scrollbar-width:none}
.circ{flex:none;width:96px;font-weight:500;font-size:12px;color:var(--ink)}
.circ .c{width:96px;height:96px;background:#fff!important;border:1px solid #e5eaee;overflow:hidden}
.circ:hover .c{border-color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.tile{position:relative;height:190px;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:20px 22px;cursor:pointer}
.tile h3{font-size:20px;font-weight:600;color:#1e1e1e;line-height:1.25;max-width:46%;align-self:center;position:relative;z-index:2}
.tile .art{position:absolute;inset-inline-end:5%;bottom:-6px;z-index:1;display:flex;align-items:flex-end;gap:4px}
.offtag{position:absolute;top:0;inset-inline-end:0;background:var(--red);color:#fff;padding:8px 18px 10px 26px;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);text-align:center;line-height:1;z-index:2}
[dir=rtl] .offtag{clip-path:polygon(0 0,86% 0,100% 100%,0 100%);padding:8px 26px 10px 18px}
.offtag small{display:block;font-size:13px;font-weight:600}
.offtag b{font-size:36px;font-weight:800}.offtag i{font-style:normal;font-size:13px;font-weight:700;display:inline-block;margin-inline-start:2px;line-height:1.05;vertical-align:top;margin-top:4px}
.sec-t{margin:38px 0 14px}
.sec-t h2{font-size:24px;font-weight:400;color:#000;letter-spacing:0}

 .hero2 .slide{position:absolute;padding:22px 18px 40px;grid-template-columns:1.2fr .8fr}
 .hero2 .slide.on{position:relative}
 .hero2 .slide h1{font-size:20px}.hero2 .slide .sub2{font-size:14px}.hero2 .slide .big{font-size:58px;letter-spacing:-2px}.hero2 .slide .big small{font-size:24px}
 .hero2 .slide p{font-size:12.5px!important}
 .hero2 .slide .btn{padding:9px 20px;margin-top:12px}
 .hero2 .slide .art{display:block!important;height:200px;transform:scale(.6);transform-origin:center right}
 [dir=rtl] .hero2 .slide .art{transform-origin:center left}
 .hero2 .arrow{display:none}
 .circles{gap:12px;margin-top:18px}.circ{width:72px}.circ .c{width:72px;height:72px}.circ .c svg{transform:scale(.8)}
 .tiles{grid-template-columns:1fr;gap:12px;margin-top:18px}.tile{height:150px}.tile h3{font-size:17px}
 .deal{padding:14px}.deal .dh h2{font-size:18px}
 .rail .row .pcard{width:165px}.pcard .pimg{height:150px}.pcard .pimg svg{transform:scale(.85)}
 .rail .arrow{display:none}
 .sec-t{margin:26px 0 10px}.sec-t h2{font-size:19px}
 .band{grid-template-columns:1fr;padding:24px;margin-top:26px}.band h2{font-size:25px}.band .phone{display:none}.caps{grid-template-columns:1fr}
 .concerns{grid-template-columns:repeat(2,1fr)}.brands{grid-template-columns:repeat(3,1fr)}.brand{font-size:13px;height:62px}
 .ings-g{grid-template-columns:1fr}.serv{grid-template-columns:repeat(2,1fr)}
 .cat-head{flex-direction:column;align-items:flex-start;padding:20px}.cat-head h1{font-size:25px}
 .catl{grid-template-columns:1fr}.side{display:none}.catl .grid.g4,.grid.g4,.grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .pd{grid-template-columns:1fr;gap:18px}.pd-img{min-height:300px}.pd-img svg{width:200px;height:auto}.pd h1{font-size:23px}
 .qty{flex-wrap:wrap}.qty .btn{flex:1 1 45%}
 .rt-head{flex-direction:column;align-items:flex-start;padding:22px}.rt-head h1{font-size:23px}.rt,.rnotes{grid-template-columns:1fr}
 .cart{grid-template-columns:1fr}
 .scanw{grid-template-columns:1fr}.sintro{padding:22px}.sintro h1{font-size:24px}.oval{width:170px;height:210px}
 footer .fw{grid-template-columns:repeat(2,1fr);padding:24px 16px}footer .fbar{flex-direction:column;align-items:flex-start;gap:14px;padding:18px 16px}footer .pay{margin:0}
 /* agent full screen */
 .agent{width:100vw;height:100dvh;top:auto}
 #agMin{display:grid}
 .agent .composer{padding-bottom:max(12px,env(safe-area-inset-bottom))}
 .agent.mini{height:auto;transform:none;top:auto;bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(20,56,92,.25)}
 .agent.mini>*:not(.ag-mini){display:none!important}
 .agent.mini .ag-mini{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,#14385c,#2c6ba4);color:#fff;border-radius:18px 18px 0 0}
 .ag-mini img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid rgba(255,255,255,.6);flex:none}
 .agent.speaking .ag-mini img{animation:talk .32s ease-in-out infinite alternate}
 .ag-mini .mt{flex:1;min-width:0;font-size:12.5px;line-height:1.4}
 .ag-mini .mt b{display:block;font-size:11px;color:#8cc8ff}
 .ag-mini .mt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .ag-mini button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;flex:none;display:grid;place-items:center}
 .ag-mini button.end{background:#ea264d}
 .lfab{bottom:14px;inset-inline-end:14px;padding:5px}.lfab .ftx{display:none}.lfab .fph{width:50px;height:50px}.lfab .fmic{width:42px;height:42px}
 .demo2{bottom:16px;inset-inline-start:14px;padding:10px 14px;font-size:12px}
 .stage{padding:12px 14px}.st-ph{width:104px;height:104px}
}
</style>

/* ===== VOICE: human-like TTS, hands-free, barge-in ===== */
let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];showVoiceName();}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){
 const lang=L==='ar'?'ar':'en';let best=null,bs=-1;
 const fem=L==='ar'?/zariyah|salma|hoda|amany|laila|layla|mariam|amira|rana|fatima|noura|sana/i:/aria|jenny|ava|emma|michelle|sonia|libby|natasha|samantha|zira|female|google us english|karen|moira/i;
 for(const v of voices){const vl=v.lang.toLowerCase();if(!vl.startsWith(lang))continue;let s=0;
  if(/natural|neural|online|premium|enhanced/i.test(v.name))s+=10;if(fem.test(v.name))s+=5;
  if(L==='ar'&&/sa|ae/.test(vl))s+=3;if(L==='en'&&/us|gb/.test(vl))s+=2;if(/google/i.test(v.name))s+=2;
  if(s>bs){bs=s;best=v;}}
 return best;
}
function showVoiceName(){const el=document.getElementById('vname');if(!el)return;const v=pickVoice();el.innerHTML=v?(t('voiceL')+' '+v.name.replace(/Microsoft |Google /,'').replace(/ - .*/,'')+(/natural|neural|online/i.test(v.name)?' ✦':'')+(/natural|neural|online/i.test(v.name)?'':` · ${t('edgeTip')}`)):t('edgeTip');}
let utterQ=[],fakeT=null,speakRes=null;
function speak(text){
 return new Promise(res=>{
  stopSpeaking(false);
  const clean=text.replace(/[✓★✦]/g,'').trim();S.curText=clean;
  const done=()=>{if(speakRes===res){speakRes=null;setSpeaking(false);res();}};
  speakRes=res;
  if(!S.tts||!window.speechSynthesis||!voices.length){
   if(!S.voice){done();return;}
   setSpeaking(true);fakeT=setTimeout(done,Math.min(900+clean.length*40,10000));return;
  }
  const parts=clean.match(/[^.!?؟]+[.!?؟]*/g)||[clean];const v=pickVoice();
  utterQ=parts.map((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=L==='ar'?'ar-SA':'en-US';if(v)u.voice=v;
   const nat=v&&/natural|neural|online/i.test(v.name);u.rate=L==='ar'?(nat?1.12:1.05):(nat?1.15:1.1);u.pitch=1;
   u.onstart=()=>setSpeaking(true);if(i===parts.length-1){u.onend=done;}u.onerror=done;return u;});
  utterQ.forEach(u=>speechSynthesis.speak(u));
  setTimeout(()=>{if(speakRes===res&&!speechSynthesis.speaking&&!speechSynthesis.pending)done();},2500);
  setTimeout(done,6000+clean.length*80);
 });
}
function stopSpeaking(resolve=true){clearTimeout(fakeT);if(window.speechSynthesis)speechSynthesis.cancel();utterQ=[];if(resolve&&speakRes){const r=speakRes;speakRes=null;setSpeaking(false);r();}}
function setSpeaking(on){S.speaking=on;AG.classList.toggle('speaking',on);if(on&&S.voice)setState('speaking');else if(!on&&S.voice&&!S.busy)setState('listening');}
function setState(k){S.st=k;AG.classList.toggle('listening',k==='listening');const el=document.getElementById('stState');if(el)el.textContent=t('stt')[k];}
function setCap(who,text){const c=document.getElementById('stCap');c.classList.toggle('user',who==='user');c.querySelector('small').textContent=who==='user'?t('you'):t('lShort');c.querySelector('span').textContent=text;const m=document.getElementById('miniCap');if(m)m.textContent=(who==='user'?t('you')+': ':'')+text;}
function toggleTTS(){S.tts=!S.tts;document.getElementById('ttsB').classList.toggle('off',!S.tts);if(!S.tts)stopSpeaking();}
function toggleMute(){S.mute=!S.mute;document.getElementById('muteB').classList.toggle('off',S.mute);if(S.mute){try{rec&&rec.abort()}catch(e){}}else restartRec();}
function flashIntr(){const e=document.getElementById('intr');e.textContent=t('intrW');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600);}
function interrupt(){if(S.speaking||S.busy){S.abort=true;stopSpeaking();flashIntr();setState('listening');}}
/* speech recognition, continuous with barge-in */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const words=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').split(/\s+/).filter(Boolean);
function isEcho(s){if(!S.curText)return false;const a=words(s),b=new Set(words(S.curText));if(!a.length)return true;return a.filter(w=>b.has(w)).length/a.length>.6;}
function startRec(){
 if(!S.voice||S.sim||S.mute)return;
 if(!SR){S.sim=true;toast(t('micNA'));return;}
 try{rec&&rec.abort()}catch(e){}
 rec=new SR();rec.lang=L==='ar'?'ar-SA':'en-US';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{let interim='',fin='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript;}
  const live=(fin||interim).trim();if(!live)return;
  if(S.speaking&&isEcho(live))return;
  if((S.speaking||S.busy)&&words(live).length>=2)interrupt();
  if(!S.speaking)setCap('user',live);
  if(fin.trim()&&!isEcho(fin)){const q=fin.trim();setCap('user',q);ask(q,true);}
 };
 rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){S.sim=true;toast(t('micNA'));}};
 rec.onend=()=>{if(S.voice&&!S.sim&&!S.mute)setTimeout(startRec,250);};
 try{rec.start();setState(S.speaking?'speaking':'listening');}catch(e){}
}
function restartRec(){if(S.voice&&!S.sim){try{rec&&rec.abort()}catch(e){}setTimeout(startRec,300);}}
function toggleVoice(){S.voice?voiceOff():voiceOn();}
async function voiceOn(sim){
 openAgent(true);if(S.voice)return;
 S.voice=true;S.sim=!!sim;AG.classList.add('voice');setCap('bot','');showVoiceName();
 document.getElementById('stEq').innerHTML=bars(20);setState('listening');
 sysMsg(t('voiceStart'));
 if(!S.greeted||sim){S.greeted=1;const g=t('vGreet');setCap('bot',g);const d=document.createElement('div');d.className='m b';d.innerHTML=`${ph()}<div class="bx">${g}</div>`;msgs.appendChild(d);scrollB();startRec();await speak(g);}
 else startRec();
 if(S.voice)setState('listening');
}
function voiceOff(silent){if(!S.voice)return;S.voice=false;S.sim=false;try{rec&&rec.abort()}catch(e){}stopSpeaking();AG.classList.remove('voice','speaking','listening','mini');if(!silent)sysMsg(t('voiceEnd'));if(demoRun){demoRun=false;resetDemoBtn();}}
async function simSay(text,interrupting){
 if(!interrupting)setState('listening');
 const w=text.split(' ');let s='';
 for(const x of w){if(!S.voice&&!interrupting)return;s+=(s?' ':'')+x;setCap('user',s);if(interrupting&&w.indexOf(x)===1)interrupt();await sleep(170);}
 await sleep(350);
 return ask(text,true);
}

function snap(){const v=document.getElementById('camv');const c=document.createElement('canvas');const s=Math.min(v.videoWidth,v.videoHeight)||480;c.width=c.height=480;const x=c.getContext('2d');x.translate(480,0);x.scale(-1,1);x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,480,480);closeCam();runScan(c.toDataURL('image/jpeg',.85),true);}

async function runScan(src,mine){
 openAgent(true);S.scanImg=src;S.scan='scanning';go('analysis',null,true);renderScan();
 if(mine)userMsg(t('myPhoto'),false,src);

 const resP=analyzeImg(src);
 for(let i=0;i<steps.length;i++){steps[i].className='run';await sleep(650);steps[i].className='ok';steps[i].querySelector('i').textContent='✓';}
 S.scanRes=await resP;S.scan='done';S.concern=S.scanRes.primary;renderScan();
 const r=S.scanRes,E=L==='en',c=C[r.primary][L];
 S.last=r.recs.slice(0,3);
 await botMsg(E?`I've analysed your photo. Your skin looks ${r.typeEn.toLowerCase()}, and the main thing I'd focus on is ${C[r.primary].en.toLowerCase()}. Hydration is ${r.m.hyd}%, oil balance ${r.m.oil}% and redness ${r.m.red}%. These are my picks for you, and your full results are open now.`:`حللت صورتك. بشرتك تبدو ${r.typeAr}، وأهم شيء أركز عليه هو ${c}. الترطيب ${num(r.m.hyd)}٪، توازن الدهون ${num(r.m.oil)}٪ والاحمرار ${num(r.m.red)}٪. هذه اختياراتي لك، ونتائجك الكاملة مفتوحة الآن.`,
  {html:`<div class="scanmsg">${[['hyd',r.m.hyd],['oil',r.m.oil],['red',r.m.red],['spt',r.m.spt]].map(x=>`<div><span>${t('mt')[x[0]]}</span><b>${num(x[1])}%</b></div>`).join('')}</div>`,cards:r.recs.slice(0,4),sugg:'afterScan'});
}
function analyzeImg(src){
 return new Promise(res=>{
  const im=new Image();if(!src.startsWith('data:'))im.crossOrigin='anonymous';
  const fallback=()=>res(scoreFrom(Math.random()*1000|0,null));
  im.onload=()=>{try{const N=96,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});const s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,N,N);const d=x.getImageData(0,0,N,N).data;res(scoreFrom(0,{d,N}));}catch(e){fallback();}};
  im.onerror=fallback;im.src=src;setTimeout(()=>{if(!im.complete)fallback();},6000);
 });
}
function scoreFrom(seed,px){
 const cl=v=>Math.max(8,Math.min(95,Math.round(v)));
 let hyd,oil,red,spt,tex,por;
 if(px){const {d,N}=px;let L=[],R=0,cnt=0,hash=0,grad=0;
  const lum=(i)=>.299*d[i]+.587*d[i+1]+.114*d[i+2];
  for(let y=Math.floor(N*.25);y<N*.85;y++)for(let x=Math.floor(N*.25);x<N*.75;x++){const i=(y*N+x)*4;const l=lum(i);L.push([l,x,y]);R+=(d[i]-(d[i+1]+d[i+2])/2);cnt++;hash=(hash*31+d[i])%9973;if(x>N*.25+1){grad+=Math.abs(l-lum(i-4));}}
  const m=L.reduce((a,b)=>a+b[0],0)/cnt,sd=Math.sqrt(L.reduce((a,b)=>a+(b[0]-m)**2,0)/cnt)||1;
  const tz=L.filter(p=>p[2]<N*.5&&p[1]>N*.38&&p[1]<N*.62),hi=tz.filter(p=>p[0]>m+1.3*sd).length/(tz.length||1);
  const ck=L.filter(p=>p[2]>N*.5&&(p[1]<N*.42||p[1]>N*.58)),dk=ck.filter(p=>p[0]<m-1.5*sd).length/(ck.length||1);
  const rd=R/cnt,gr=grad/cnt;seed=hash;
  oil=30+hi*420;red=18+rd*.9;spt=18+dk*380;tex=18+gr*2.2;hyd=88-tex*.55-(oil>55?4:12)+((seed%7)-3);por=(oil+tex)/2;
 }
 const j=k=>((seed*(k+3)*7919)%13)-6;
 if(!px){oil=45+j(1)*3;hyd=50+j(2)*3;red=35+j(3)*3;spt=40+j(4)*3;tex=40+j(5)*2;por=45+j(6)*2;}
 const m={hyd:cl(hyd),oil:cl(oil+j(1)),red:cl(red+j(2)),spt:cl(spt+j(3)),tex:cl(tex+j(4)),por:cl(por+j(5))};
 const iss={dry:100-m.hyd,oily:m.oil,sensitive:m.red,spots:m.spt};const primary=Object.keys(iss).sort((a,b)=>iss[b]-iss[a])[0];
 const second=Object.keys(iss).sort((a,b)=>iss[b]-iss[a])[1];
 let typeEn,typeAr;if(m.oil>58&&m.hyd<50){typeEn='Combination';typeAr='مختلطة';}else if(m.oil>58){typeEn='Oily';typeAr='دهنية';}else if(m.hyd<50){typeEn='Dry';typeAr='جافة';}else if(m.red>60){typeEn='Sensitive';typeAr='حساسة';}else{typeEn='Normal';typeAr='عادية';}
 const score=Math.round(100-(iss.dry+iss.oily+iss.sensitive+iss.spots)/4*.7);
 const recs=[...new Set([...PICKS[primary],PICKS[second][0],primary==='sensitive'?'p13':'p12'])];
 return {m,primary,second,typeEn,typeAr,score,recs};
}

 if(S.scan==='scanning'){

  return;
 }
 const r=S.scanRes,m=r.m;const col={hyd:'#4fa7e0',oil:'#41c18a',red:'#ec8f98',spt:'#f2a14a',tex:'#9b7fd6',por:'#7a8da0'};
 const pins=[['oil',50,30,t('zones')[0]],['por',50,52,t('zones')[1]],['hyd',30,60,t('zones')[2]],['spt',70,62,t('zones')[3]],['red',50,80,t('zones')[4]]];
 const circ=2*Math.PI*46,off=circ*(1-r.score/100);
 w.innerHTML=head+`<div class="scanw"><div><div class="sphoto done"><img src="${S.scanImg}">${mesh}${pins.map((p,i)=>`<div class="pin" style="left:${p[1]}%;top:${p[2]}%;animation-delay:${i*.15}s"><i style="background:${col[p[0]]}"></i><span>${p[3]} · ${num(m[p[0]])}%</span></div>`).join('')}</div>
 <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn sec" onclick="S.scan='intro';renderScan()">↺ ${t('rescan')}</button><button class="btn sec" onclick="voiceOn()">🎙 ${t('discuss')}</button></div></div>
 <div class="sbox"><div class="sres-top"><div class="ring"><svg width="110" height="110"><circle cx="55" cy="55" r="46" stroke="#eaf2f9" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="46" stroke="url(#rg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#2c6ba4"/><stop offset="1" stop-color="#41c18a"/></linearGradient></defs></svg><b>${num(r.score)}</b><small>${t('skinScore')}</small></div>
 <div><h2 style="font-size:24px;color:#14385c">${t('resH')}</h2><span class="stype">✦ ${t('type')}: ${E?r.typeEn:r.typeAr}</span><div class="cchips"><span style="background:#fdeaee;color:#ea264d">${t('focus')}: ${C[r.primary][L]}</span><span style="background:#fff4e2;color:#c77a12">${t('also')}: ${C[r.second][L]}</span></div></div></div>
 ${Object.keys(col).map(k=>`<div class="meter"><div class="top"><span>${t('mt')[k]}</span><span>${num(m[k])}%</span></div><div class="bar"><i data-w="${m[k]}" style="background:${col[k]}"></i></div></div>`).join('')}
 <div class="lsum">${ph()}<div><b>✦ ${t('lSays')}</b>${t('advice')[r.primary]}</div></div>
 <h3 style="font-size:17px;margin:6px 0 12px">${t('recsH')}</h3><div class="grid g3" style="grid-template-columns:repeat(2,1fr)">${r.recs.slice(0,4).map(id=>card(byId(id),true)).join('')}</div>
 <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn pri" onclick="ask(L==='en'?'Build me a routine':'سوّ لي روتين')">${t('bR')}</button><button class="btn callg" onclick="r_addAll()">${t('addRecs')}</button></div><p class="disc">${t('disc')}</p></div></div>`;
 setTimeout(()=>document.querySelectorAll('.meter i').forEach(i=>i.style.width=i.dataset.w+'%'),150);
}
